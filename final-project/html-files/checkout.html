<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TechStore | Checkout</title>

    <link rel="stylesheet" href="styles/small.css">

    <script src="scripts/main.js" defer></script>
    <script src="scripts/checkout.js" type="module" defer></script>
</head>

<body>
<header>
    <div class="header-content">
        <a id="logo" href="index.html">TechStore</a>

        <nav>
            <a href="#" id="menu-toggle">☰</a>
            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="categories.html">Categories</a></li>
                <li><a href="cart.html">Cart</a></li>
                <li><a href="login.html">Login</a></li>
            </ul>
        </nav>
    </div>
</header>

<main>
    <h2>Checkout</h2>

    <div class="checkout-items"></div>

    <form id="checkout-form">
        <input id="name" name="name" placeholder="Name">
        <input id="email" name="email" placeholder="Email">
        <input id="address" name="address" placeholder="Address">
        <input id="phone" name="phone" placeholder="Phone">

        <button type="submit">Place Order</button>
    </form>

    <p id="order-message"></p>
</main>

<footer>
    <p>&copy; <span id="current-year"></span> TechStore. All rights reserved.</p>
</footer>
</body>
</html>
